<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/eclipse.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ff;
      --surface: rgba(255, 255, 255, 0.82);
      --border: rgba(220, 20, 60, 0.14);
      --text: #0f172a;
      --muted: #5f6b7a;
      --accent: #dc143c;
      --accent-dark: #b01031;
      --shadow: rgba(15, 23, 42, 0.14);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(220, 20, 60, 0.13), transparent 28%),
        radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.08), transparent 26%),
        linear-gradient(180deg, #f7f6ff 0%, #f2f0ff 100%);
    }

    .shell {
      width: min(100%, 760px);
      padding: 18px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 28px 80px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card {
      padding: 42px;
      border-radius: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(220, 20, 60, 0.24);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      max-width: 44ch;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 178px;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 30px rgba(220, 20, 60, 0.22);
    }

    .primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .secondary {
      border: 1px solid rgba(15, 23, 42, 0.12);
      color: var(--text);
      background: rgba(255, 255, 255, 0.72);
    }

    .secondary:hover {
      border-color: rgba(220, 20, 60, 0.28);
      transform: translateY(-1px);
    }

    .helper {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      font-size: 0.96rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .shell {
        padding: 12px;
        border-radius: 24px;
      }

      .card {
        padding: 30px 24px;
        border-radius: 20px;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="eyebrow">404</div>
      <h1>Sayfa Bulunamadı</h1>
      <p>Aradığınız adres kullanılamıyor veya kaldırılmış olabilir.</p>
      <div class="actions">
        <a class="secondary" href="javascript:history.back()">Onceki Sayfaya Git</a>
      </div>
    </section>
  </main>
</body>
</html>
