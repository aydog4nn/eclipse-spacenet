<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni İletisim Mesajı</title>
</head>
<body style="margin:0;padding:24px;background:#f5f4ff;font-family:Segoe UI,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" style="width:100%;max-width:680px;margin:0 auto;background:#ffffff;border-radius:24px;border:1px solid rgba(220,20,60,0.14);overflow:hidden;">
    <tr>
      <td style="padding:32px 32px 18px;">
        <div style="display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid rgba(220,20,60,0.22);color:#dc143c;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;">İletisim Formu</div>
        <h1 style="margin:18px 0 10px;font-size:30px;line-height:1.1;">Yeni bir mesaj alındı</h1>
        <p style="margin:0;color:#5f6b7a;font-size:15px;line-height:1.7;">Yeni iletişim formu mesajı aşağıdadır.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px;">
        <table role="presentation" style="width:100%;border-collapse:collapse;background:#f8f8ff;border-radius:18px;overflow:hidden;">
          <tr>
            <td style="padding:16px 18px;border-bottom:1px solid rgba(15,23,42,0.08);font-weight:700;width:140px;">Ad</td>
            <td style="padding:16px 18px;border-bottom:1px solid rgba(15,23,42,0.08);" th:text="${senderName}">Gonderen Adi</td>
          </tr>
          <tr>
            <td style="padding:16px 18px;border-bottom:1px solid rgba(15,23,42,0.08);font-weight:700;">E-posta</td>
            <td style="padding:16px 18px;border-bottom:1px solid rgba(15,23,42,0.08);" th:text="${senderEmail}">gonderen@example.com</td>
          </tr>
          <tr>
            <td style="padding:16px 18px;font-weight:700;vertical-align:top;">Mesaj</td>
            <td style="padding:16px 18px;white-space:pre-wrap;line-height:1.7;" th:text="${message}">Mesaj icerigi</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
