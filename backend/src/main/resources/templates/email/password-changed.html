<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>
    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212 !important;
                color: #e0e0e0 !important;
            }

            .container {
                background-color: #1e1e1e !important;
                color: #e0e0e0 !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color: #f4f6f8; font-family: Arial, sans-serif;">
<table align="center" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td>
            <table align="center" cellpadding="0" cellspacing="0" width="600" class="container"
                   style="background-color: #ffffff; border-radius: 8px; padding: 30px;">
                <tr>
                    <td>
                        <h2 style="color: #4a90e2; text-align: center;">Password Successfully Changed</h2>
                        <p>Your password has been updated successfully.</p>
                        <p>If you did not initiate this action, review your account activity and reset your password immediately.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
